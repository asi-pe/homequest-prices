name: Weekly Health Report

on:
  schedule:
    # 05:00 UTC Sunday - 08:00 Israel time
    - cron: '0 5 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  report:
    name: Post weekly report
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect chain health
        id: collect
        env:
          SUPABASE_URL: https://echyvokwnbhxbrgsoodt.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_iPzc_6x1FIfKulh9ELzSuQ_IVRe0YaK
        run: |
          set -euo pipefail

          chains='RAMI_LEVY|רמי לוי
          SHUFERSAL|שופרסל
          VICTORY_NEW_SOURCE|ויקטורי
          YOHANANOF|יוחננוף
          OSHER_AD|אושר עד
          MAHSANI_ASHUK_NEW_SOURCE|מחסני השוק
          YAYNO_BITAN_AND_CARREFOUR|יינות ביתן / קרפור'

          : > rows.md
          fresh=0
          total=0

          while IFS='|' read -r code label; do
            code=$(printf '%s' "$code" | tr -d '[:space:]')
            [ -z "$code" ] && continue
            total=$((total + 1))

            count=$(curl -sS -m 30 -I \
              "${SUPABASE_URL}/rest/v1/prices?select=barcode&chain=eq.${code}" \
              -H "apikey: ${SUPABASE_ANON_KEY}" -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              -H "Prefer: count=exact" -H "Range: 0-0" \
              | tr -d '\r' | grep -i '^content-range' | sed 's#.*/##' || true)
            count=${count:-0}

            updated=$(curl -sS -m 30 \
              "${SUPABASE_URL}/rest/v1/prices?select=updated_at&chain=eq.${code}&order=updated_at.desc&limit=1" \
              -H "apikey: ${SUPABASE_ANON_KEY}" -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              | grep -o '"updated_at":"[^"]*"' | head -1 | cut -d'"' -f4 || true)

            if [ -n "${updated:-}" ]; then
              age=$(( ( $(date -u +%s) - $(date -u -d "$updated" +%s) ) / 86400 ))
              if [ "$age" -le 2 ]; then
                icon='🟢'
                fresh=$((fresh + 1))
              else
                icon='🟡'
              fi
              printf '| %s | %s | עודכן לפני %s ימים | %s |\n' "$label" "$count" "$age" "$icon" >> rows.md
            else
              printf '| %s | %s | ללא נתונים | 🔴 |\n' "$label" "$count" >> rows.md
            fi
          done <<< "$chains"

          echo "fresh=$fresh" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"

      - name: Post the report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FRESH: ${{ steps.collect.outputs.fresh }}
          TOTAL: ${{ steps.collect.outputs.total }}
          ISSUE_TITLE: 'דוח בריאות שבועי — סנכרון מחירי רשתות'
        run: |
          set -euo pipefail

          if [ "$FRESH" -eq 0 ]; then
            headline="🔴 **כל הרשתות לא מעודכנות.** יש לבדוק את תהליך הסנכרון היומי."
          elif [ "$FRESH" -lt 4 ]; then
            headline="🟡 **סנכרון חלקי בלבד** — ${FRESH} מתוך ${TOTAL} רשתות מעודכנות."
          else
            headline="🟢 **הסנכרון תקין לחלוטין.** ${FRESH} מתוך ${TOTAL} רשתות מעודכנות."
          fi

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          {
            printf '## %s\n\n' "$headline"
            printf '| רשת | מספר מוצרים | סטטוס עדכון | |\n'
            printf '| --- | ---: | --- | :-: |\n'
            cat rows.md
            printf '\n<div dir="rtl">\n\n'
            printf '**מקרא סטטוסים:**\n\n'
            printf -- '- 🟢 הרשת סונכרנה ב-48 השעות האחרונות\n'
            printf -- '- 🟡 לא עודכן מעל 2 ימים\n'
            printf -- '- 🔴 אין נתונים זמינים\n\n'
            printf '</div>\n\n'
            printf -- '*דוח זה מופק אוטומטית על ידי [GitHub Actions](%s)*\n' "$run_url"
          } > report.md

          cat report.md >> "$GITHUB_STEP_SUMMARY"

          num=$(gh issue list --state open --limit 100 --json number,title \
                  --jq "map(select(.title==\"${ISSUE_TITLE}\")) | .[0].number // empty" || true)

          if [ -z "${num:-}" ]; then
            gh issue create --title "$ISSUE_TITLE" --body-file report.md
            echo "opened the tracking issue"
          else
            gh issue comment "$num" --body-file report.md
            echo "commented on issue #${num}"
          fi
